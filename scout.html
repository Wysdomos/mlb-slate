<script id="gd" type="application/json">[{"title": "WHAT IS SSJ (THE ZONE)?", "entries": [{"term": "The Concept", "def": "SSJ (The Zone) is matchup intelligence. Every batter on today's slate is scored against their specific pitcher and ranked from strongest to weakest matchup. Think of it as going Super Saiyan — when the conditions align perfectly, a batter enters a different power level."}, {"term": "What It Is NOT", "def": "SSJ is not a straight stat lookup. It weights Zone score, pitcher vulnerability, ISO power, wOBA, platoon advantage, and active streaks into a single composite ranking. A high-average hitter facing a soft-tossing lefty will score differently than a power hitter facing the same pitcher."}, {"term": "How To Use It Daily", "def": "Start with the OVER NINE THOUSAND section — top 5 plays of the day. Then check the SSJ MATCHUPS tab ranked list for the full ordered board. Filter by DANGER ONLY to find the highest-exploitation matchups. Cross-reference with the main Slate's Conviction Board for double-signal plays."}]}, {"title": "THE GRADES — YOUR POWER CLASS", "entries": [{"term": "SUPER SAIYAN — Elite Tier", "def": "All factors align: high Zone score, strong ISO and wOBA, facing a vulnerable or struggling pitcher, often with platoon advantage. These are the day's primary targets. A SUPER SAIYAN play with a DANGER tag is the strongest single-play signal on the board."}, {"term": "BASE FORM — Solid Tier", "def": "Decent matchup but one or two factors are working against the play — a tough pitcher, a suppressor park, weak streak, or marginal platoon. Still worth including in combos or as supporting legs. Not the anchor, but a valid contributor."}, {"term": "YAMCHA — Fade Tier", "def": "Named after the Dragon Ball Z character who famously loses every fight. These matchups have one or more significant negatives — a dominant pitcher, bad park factor for HRs, or unfavorable platoon. Listed for transparency and as fade targets. If you see a YAMCHA play getting heavy betting action, that's a fade signal, not a tail."}, {"term": "How Grades Are Set", "def": "Grades come from the Sweet Spot Analyzer in the workbook — a multi-factor model combining ISO, wOBA, Zone matchup score, park HR factor, and pitcher grade. Grades are locked at build time and do not change intraday. Check back the next build for updates."}]}, {"title": "THE ZONE BADGE ⚡N", "entries": [{"term": "What the Number Means", "def": "The Zone badge score is a composite matchup grade from the best-spots model. It combines ISO, wOBA, home run output, pitcher vulnerability, and platoon advantage into a single integer. Higher is better. A Zone 11 batter has a significantly stronger matchup profile than a Zone 4."}, {"term": "Zone 10+ — FEATURED PLAYS", "def": "Any Zone score of 10 or higher is elevated to the Featured Plays section at the top of the current grade tab. These are the elite matchups of the day within each grade tier. Start here before scrolling the full board."}, {"term": "Gold Glow ⚡", "def": "A Zone badge with gold glow animation means the batter is STRONG grade and Zone 10+. Maximum matchup quality — prioritize these."}, {"term": "Fire Badge 🔥", "def": "When a batter has an active hot streak (Hit streak 4+ games, HR streak 2+ games, or HRR streak 3+ games), the badge switches from gold glow to orange fire pulse. The 🔥 icon also appears on the badge itself. Streaks compound the matchup quality signal."}]}, {"title": "DANGER TAG ⚠", "entries": [{"term": "What DANGER Means", "def": "The opposing pitcher has a Vulnerability Score of 70 or higher — meaning they are highly exploitable today based on ERA trend, HR/9 rate, park factors, and matchup history. DANGER is the single most actionable signal on the board."}, {"term": "STRONG + DANGER = Top Priority", "def": "A STRONG-grade batter with a DANGER-tagged pitcher is the strongest signal combination. Backtesting shows MODERATE + DANGER also outperforms STRONG-only on HR rate (exploitable pitcher matters more than batter tier in many matchups)."}, {"term": "Red Indicators 🔴", "def": "If PROJ H shows 8.0+ or PROJ ERA shows 5.50+, a red dot appears next to the value. Both lit simultaneously means the pitcher is in full meltdown projection for this start. These are the most exploitable starts on the board."}, {"term": "VulnScore 50-69 (Gold)", "def": "Caution zone — the pitcher is hittable but not in meltdown territory. Worth considering especially when combined with strong batter metrics. No DANGER tag but still above average exploitation potential."}, {"term": "VulnScore Under 50 (Dim)", "def": "The pitcher is in reasonable control. Matchup is still tracked but exploitation upside is limited. Weight the batter's own metrics more heavily in these matchups."}]}, {"title": "PITCHER PROJECTIONS", "entries": [{"term": "VULN — Vulnerability Score (0 to 100)", "def": "Our internal pitcher exploitation grade computed from ERA trend, HR/9 rate, park HR factor, and walk rate. 70+ triggers the DANGER tag (red). 50-69 = elevated risk (gold). Under 50 = manageable (dim). Built from the Sweet Spot Slate tab in the workbook."}, {"term": "PROJ H — Projected Hits Allowed", "def": "Estimated hits allowed for today's start based on ERA and BF projections. Shows in red when 8.0 or higher. At that level, the pitcher is expected to be consistently hittable — every batter in the lineup benefits."}, {"term": "PROJ ERA — Projected ERA", "def": "Expected ERA for this start. Shows in red when 5.50 or higher. Combined with PROJ H red — both lit at once means this is one of the most attackable starts on the entire slate. Target the batter's whole combo board, not just HR."}, {"term": "ERA (Card Sub-line)", "def": "The season ERA shown next to the pitcher's name in each card. This is the raw season figure from the workbook. PROJ ERA is the model's day-specific forecast, which can differ significantly from the season number based on current form."}]}, {"title": "BATTER STATS", "entries": [{"term": "ISO — Isolated Power", "def": "Slugging percentage minus batting average. Strips out singles and measures pure extra-base power. The most direct predictor of HR output in the model. ISO above .250 is elite. Above .300 is rare and is the strongest single-stat HR signal available."}, {"term": "wOBA — Weighted On-Base Average", "def": "The most complete single-number offensive metric. Weights singles, doubles, triples, HRs, and walks by their actual run value. An elite wOBA (.400+) combined with high ISO means a batter is both powerful and consistently dangerous. Source: Scout tab in the workbook."}, {"term": "HR — Season Home Runs", "def": "The batter's total home runs on the year. Context for their current power output ceiling. A player at 20+ HRs in June is in a different risk profile than someone at 5. The model uses this alongside ISO to weight HR probability."}]}, {"title": "STREAKS — MOMENTUM FLAGS", "entries": [{"term": "HIT — Hit Streak", "def": "Consecutive games with at least one hit. Active at any length, highlighted in gold when it reaches 4 or more games. A long hit streak increases the probability of continued contact. 🔥 fire appears at 4+ games."}, {"term": "HR — Home Run Streak", "def": "Consecutive games with at least one home run. ⚡ activates at 2+ consecutive games. A player on a 2-game HR streak is in confirmed power form. A 3-game HR streak is extremely rare and significantly increases today's probability."}, {"term": "HRR — Hits + Runs + RBIs Streak", "def": "Tracks whether a batter recorded at least one Hit AND one Run AND one RBI in the same game. All three must occur in the same game for the game to count toward the streak. Active at 3+ consecutive games. A player maintaining an HRR streak is contributing across all three offensive categories — the most complete signal of elite performance."}, {"term": "Dash ( — )", "def": "No active streak. This is neutral, not negative. Many elite plays have no streak because streaks are rare. The absence of a streak does not reduce the matchup quality grade."}, {"term": "Streak Stacking", "def": "When a player has multiple active streaks (e.g., hit streak 6 games AND HR streak 2 games), their Zone badge glows fire orange and 🔥 appears. The SSJ composite score also receives a bonus for each active streak. Stack signals are the highest-conviction plays."}]}, {"title": "PLATOON ADVANTAGE", "entries": [{"term": "What Platoon Means", "def": "Batters historically perform significantly better against pitchers throwing from the opposite hand. A left-handed batter vs a right-handed pitcher (L→R) has a statistically measurable edge in batting average, slugging, and home run rate."}, {"term": "L→R or R→L with ⚡ (Gold)", "def": "Confirmed platoon advantage. The batter faces the opposite-hand pitcher. Shows gold with ⚡ symbol. This is a meaningful edge — especially in power matchups. It compounds Zone score and pitcher vulnerability."}, {"term": "L→L or R→R (Dimmed)", "def": "Same-hand matchup. No platoon advantage. The platoon edge is removed from the scoring. The play can still be valid on other factors, but one signal is missing."}, {"term": "S→R or S→L with ⚡ (Always Gold)", "def": "Switch hitters always bat from the favorable side regardless of pitcher hand. Always treated as a confirmed platoon advantage. Switch hitters facing any pitcher always get the ⚡ platoon tag."}]}, {"title": "WHAT?! IT'S OVER NINE THOUSAAAAAND!!", "entries": [{"term": "What It Is", "def": "The five highest-ranked plays of the day by composite SSJ Score, pinned at the top above all other content on every main grade tab. These are the absolute highest-conviction plays on today's slate. Named after the famous Dragon Ball Z scene where Vegeta's scouter explodes reading Goku's power level."}, {"term": "How It's Ranked", "def": "SSJ Score = (Zone × 3) + (VulnScore / 100 × 20) + (ISO × 30) + (wOBA × 20) + (HR × 0.2) + streak bonuses + DANGER/grade bonuses. The top 5 by this score appear in the horizontal scroll strip."}, {"term": "How To Use It", "def": "Swipe right to see all 5 cards. Each shows Zone, grade, DANGER, streaks, ISO, wOBA, and platoon at a glance. These are your daily anchors. If you only play 2 picks today, start here. Cross-reference with the Conviction Board on the main Slate."}, {"term": "Why Only 5?", "def": "Five is intentional. Giving you 20 elite plays dilutes the signal. Five forces ranking and prioritization. On a 15-game slate, 5 truly elite matchups is a generous count. If all 5 are STRONG + DANGER, that's a rare convergence worth noting."}]}, {"title": "THE TABS — ROW 1 (GRADE FILTERS)", "entries": [{"term": "⚡ SUPER SAIYAN", "def": "Shows only STRONG-grade matchups. These are the elite plays of the day. Default view when you open SSJ. Start here every session."}, {"term": "BASE FORM", "def": "Shows only MODERATE-grade matchups. Solid supporting plays. Use for combo legs, backup plays when Super Saiyan count is low, or when a MODERATE play has a DANGER tag and strong ISO."}, {"term": "YAMCHA", "def": "Shows only WEAK-grade matchups — the Yamcha plays. Good for identifying fade targets. If you see heavy sharp money on a YAMCHA play, that is a counter-signal. Also useful for identifying which pitchers are truly elite today."}, {"term": "ALL (N)", "def": "Shows all matchups across all grades with no filter. The number in parentheses is the total count for the day. Use this for a full slate overview or when researching a specific batter across grade lines."}]}, {"title": "THE TABS — ROW 2 (DBZ SPECIALS)", "entries": [{"term": "🌟 SSJ MATCHUPS", "def": "The full ranked list sorted by composite SSJ Score — the definitive ordered board for the day. Top 50 shown. Apply DANGER ONLY or PLATOON ADV ONLY filters here for the tightest signal stack. Rank numbers (#01, #02...) appear on each card. This is the page's primary use case."}, {"term": "🔁 FUSIONS", "def": "25 randomly generated 2-player parlay combos from the Top 50 SSJ Matchups. Each Fusion shows full card detail for both players. Hit RE-FUSE to generate fresh random pairs. SAME GAME tag means both players are in the same lineup — correlated parlay, strongest Fusion type. ELITE grade means both players are STRONG."}, {"term": "⚡ POWER LEVELS", "def": "This guide. A complete explanation of every metric, tag, badge, filter, and concept on the SSJ page. Bookmark this for reference when learning the system."}]}, {"title": "SSJ MATCHUPS — FILTERS", "entries": [{"term": "⚠ DANGER ONLY", "def": "Hides all matchups where the opposing pitcher's VulnScore is below 70. You see only batters facing a DANGER-tagged pitcher. This is the highest-signal filter — every result is a potential exploitation target. Best used on the SSJ MATCHUPS tab for a clean ranked danger board."}, {"term": "⚡ PLATOON ADV ONLY", "def": "Filters to batters with confirmed opposite-hand platoon advantage only. Eliminates all same-side matchups. Combine with DANGER ONLY to create the tightest possible filter — batters with platoon edge facing exploitable pitchers, ranked by composite score."}, {"term": "Result Count", "def": "When either filter is active, a count appears showing how many plays remain. If DANGER ONLY returns 4 results on a given day, those 4 are the day's most important plays regardless of their raw grade."}]}, {"title": "FUSIONS — PARLAY BUILDER", "entries": [{"term": "How Fusions Work", "def": "The system randomly picks 25 pairs from the Top 50 SSJ Matchups and presents them as parlay candidates. Both players in each Fusion are shown with full card stats — you can evaluate the pair directly without switching tabs."}, {"term": "🔁 RE-FUSE", "def": "Generates 25 brand new random pairs from the same Top 50 pool without reloading the page. Hit it multiple times to explore different combinations."}, {"term": "⚡ ELITE", "def": "Both players in the Fusion are STRONG (Super Saiyan) grade. Highest-quality parlay tier. An ELITE Fusion with SAME GAME tag is the most correlated, highest-upside combination."}, {"term": "🔥 SOLID", "def": "At least one player in the Fusion is STRONG. Strong parlay with one dominant anchor leg."}, {"term": "BASE FORM", "def": "Both players are MODERATE grade. Solid supporting play parlay. Lower upside but lower variance."}, {"term": "SAME GAME", "def": "Both players are in the same game — meaning they face the same pitcher or are in the same lineup. This is a correlated parlay. When both players are stacking against the same vulnerable pitcher, the implied correlation is real and should increase conviction."}]}, {"title": "GAME FILTER + SUPER SCROLL GRIP", "entries": [{"term": "Game Filter Dropdown", "def": "The dropdown below the tab rows filters the entire page to one specific game. Use it when you have conviction on a specific matchup and want to see only batters from that game. The CLEAR button removes the filter and restores the full view."}, {"term": "The Golden Scroll Grip", "def": "The gold bar on the right edge of the screen is a drag-to-scroll control. Drag it up or down to navigate the page at any speed. It works on both touch and mouse. The grip glows brighter gold when actively dragging. It automatically hides if the page content fits on screen."}, {"term": "Why Gold?", "def": "Everything on this page is gold. You're in Super Saiyan mode. That's the rule."}]}]</script>
<script>
var D=JSON.parse(document.getElementById('sd').textContent);
var C=JSON.parse(document.getElementById('cd').textContent);
var G=JSON.parse(document.getElementById('gd').textContent);
var cf='STRONG',cg='ALL',dO=false,pO=false,fS=0;
function gk(p){return [p.team,p.pTeam].sort().join(' · ');}
function pl(b,t){if(b==='S')return{l:'S→'+t,a:true};return{l:b+'→'+t,a:b!==t};}
function sd2(v,thr,ic){
  if(!v||v===0)return{t:'—',c:'rgba(255,255,255,.2)',s:''};
  if(v>=thr)return{t:''+v,c:'#FFD700',s:ic};
  return{t:''+v,c:'rgba(255,255,255,.65)',s:''};
}
function vc(v){return v>=70?'#FF6B6B':v>=50?'#FFD700':'rgba(255,255,255,.45)';}
function nc(g){return g==='STRONG'?'#FFF':(g==='MODERATE'?'#E8E8E8':'#A0A0A0');}
function svc(g){return g==='STRONG'?'#FFD700':(g==='MODERATE'?'#D0D0D0':'#909090');}
function slc(g){return g==='STRONG'?'rgba(255,215,0,.48)':(g==='MODERATE'?'rgba(255,255,255,.42)':'rgba(255,255,255,.3)');}
function dc2(g){return g==='STRONG'?'rgba(255,215,0,.12)':'rgba(255,255,255,.07)';}
function gts(g){
  if(g==='STRONG')return'background:rgba(255,215,0,.16);color:#FFD700;';
  if(g==='MODERATE')return'background:rgba(255,255,255,.08);color:#AAAAAA;';
  return'background:transparent;color:#666;';
}
function gdsp(g){return g==='BAD'?'WEAK':g;}
function bws(p){
  var iS=p.grade==='STRONG',iF=p.zone>=10;
  var br=iS?(iF?'1px solid rgba(255,215,0,.65)':'1px solid rgba(255,215,0,.38)'):
    (p.grade==='MODERATE'?'1px solid rgba(255,255,255,.14)':'1px solid rgba(255,255,255,.06)');
  var bg=iS?(iF?'rgba(255,215,0,.16)':'rgba(255,215,0,.09)'):'rgba(255,255,255,.04)';
  return 'border:'+br+';background:'+bg+';';
}
function ban(p){
  var hs=p.hitStreak>=4||p.hrStreak>=2||p.hrrStreak>=3;
  if(hs)return'bfire';
  if(p.grade==='STRONG'&&p.zone>=10)return'bglow';
  return'';
}
function bnc(p){return p.grade==='STRONG'?'#FFD700':(p.grade==='MODERATE'?'#AAAAAA':'#666');}
function rs(p,compact){
  var pt=pl(p.bats,p.throws),sl=slc(p.grade),sv=svc(p.grade),dc=dc2(p.grade);
  var vs=p.vulnScore,phR=p.projHits>=8.0,peR=p.projERA>=5.5;
  var phC=phR?'#FF6B6B':sv,peC=peR?'#FF6B6B':sv;
  var hit=sd2(p.hitStreak,4,'🔥'),hr=sd2(p.hrStreak,2,'⚡'),hrr=sd2(p.hrrStreak,3,'⚡');
  var sz=compact?42:46,ba=ban(p),hs=p.hitStreak>=4||p.hrStreak>=2||p.hrrStreak>=3;
  return '<div class="ct">'+
    '<div class="bw '+ba+'" style="width:'+sz+'px;height:'+sz+'px;'+bws(p)+'">'+
      '<span class="bz" style="color:'+(p.grade==='STRONG'?'#FFD700':'#3a3a3a')+'">⚡</span>'+
      '<span class="bn" style="color:'+bnc(p)+';font-size:'+(compact?'18px':'21px')+'">'+p.zone+'</span>'+
      (hs?'<span class="bf">🔥</span>':'')+
    '</div>'+
    '<div class="ci">'+
      '<div class="cn" style="color:'+nc(p.grade)+'">'+p.batter+
        ' <span style="font-size:11px;font-weight:700;color:rgba(255,215,0,.65);letter-spacing:.1em">'+p.team+'</span></div>'+
      '<div class="cm" style="color:'+(p.grade==='STRONG'?'rgba(255,255,255,.65)':'rgba(255,255,255,.5)')+'">'+
        'vs '+p.pitcher+' · '+p.pTeam+' · ERA '+p.era+'</div>'+
    '</div>'+
    '<div class="cr">'+
      '<span class="pt" style="color:'+(pt.a?'#FFD700':'rgba(255,255,255,.22)')+'">'+pt.l+(pt.a?' ⚡':'')+'</span>'+
      '<span class="gt" style="'+gts(p.grade)+'">'+gdsp(p.grade)+'</span>'+
      (p.vulnScore>=70?'<span class="dt">⚠ DANGER</span>':'')+
    '</div>'+
  '</div>'+
  '<div class="sr" style="border-color:'+dc+'">'+
    '<div class="si"><div class="sl" style="color:'+sl+'">VULN</div><div class="sv" style="color:'+vc(vs)+'">'+vs+'</div></div>'+
    '<div class="si"><div class="sl" style="color:'+sl+'">PROJ H</div>'+
      '<div class="sv" style="color:'+phC+'">'+(p.pitcher==='TBD'?'—':p.projHits)+'</div>'+(phR&&p.pitcher!=='TBD'?' 🔴':'')+' </div>'+
    '<div class="si"><div class="sl" style="color:'+sl+'">PROJ ERA</div>'+
      '<div class="sv" style="color:'+peC+'">'+(p.pitcher==='TBD'?'—':p.projERA)+'</div>'+(peR&&p.pitcher!=='TBD'?' 🔴':'')+' </div>'+
  '</div>'+
  '<div class="tc" style="border-color:'+dc+'">'+
    '<div class="col">'+
      '<div class="ph"><span style="color:'+sl+'">AVERAGES</span></div>'+
      '<div style="display:flex;gap:12px;flex-wrap:wrap">'+
        [['ISO',p.iso],['wOBA',p.woba],['HR',p.hr]].map(function(x){
          return '<div><div class="sl" style="color:'+sl+'">'+x[0]+'</div>'+
            '<div class="sv" style="color:'+sv+'">'+x[1]+'</div></div>';
        }).join('')+
      '</div>'+
    '</div>'+
    '<div class="cd"></div>'+
    '<div class="col">'+
      '<div class="ph"><span style="color:'+sl+'">STREAKS</span></div>'+
      '<div style="display:flex;gap:12px;flex-wrap:wrap">'+
        [['HIT',hit],['HR',hr],['HRR',hrr]].map(function(x){
          return '<div><div class="sl" style="color:'+sl+'">'+x[0]+'</div>'+
            '<div class="sv" style="color:'+x[1].c+'">'+x[1].t+(x[1].s?x[1].s:'')+'</div></div>';
        }).join('')+
      '</div>'+
    '</div>'+
  '</div>';
}
function rc(p,rank){
  var cls='card '+p.grade.toLowerCase();
  var rh=rank!=null?'<span class="rn" style="color:'+(rank<=3?'#FFD700':rank<=10?'rgba(255,215,0,.65)':'rgba(255,215,0,.35)')+'">#'+('0'+rank).slice(-2)+'</span>':'';
  return '<div class="'+cls+'">'+rh+rs(p,false)+'</div>';
}
function cgf(g1,g2){
  if(g1==='STRONG'&&g2==='STRONG')return{l:'⚡ ELITE',c:'#FFD700',b:'rgba(255,215,0,.18)'};
  if(g1==='STRONG'||g2==='STRONG')return{l:'🔥 SOLID',c:'#FFA040',b:'rgba(255,140,0,.14)'};
  if(g1==='MODERATE'&&g2==='MODERATE')return{l:'BASE FORM',c:'#AAAAAA',b:'rgba(255,255,255,.08)'};
  return{l:'MIXED',c:'#777',b:'rgba(255,255,255,.05)'};
}
function rfusion(pair,idx){
  var p1=pair[0],p2=pair[1];if(!p1||!p2)return'';
  var cg=cgf(p1.grade,p2.grade),sg2=gk(p1)===gk(p2);
  return '<div class="fc">'+
    '<div class="fm">'+
      '<span class="fn">FUSION #'+('0'+(idx+1)).slice(-2)+'</span>'+
      '<div class="fts">'+(sg2?'<span class="sg">SAME GAME</span>':'')+
        '<span class="cg" style="background:'+cg.b+';color:'+cg.c+'">'+cg.l+'</span>'+
      '</div>'+
    '</div>'+
    rs(p1,true)+
    '<div class="fd"><span>⚡ + ⚡</span></div>'+
    rs(p2,true)+
  '</div>';
}
function rglos(){
  return '<div id="gh" class="t-glow"><h2>⚡ POWER LEVELS</h2>'+
    '<div class="gs">A Saiyan\'s Field Guide to the Zone</div></div>'+
    G.map(function(sec){
      return '<div class="gs-sec">'+
        '<div class="gs-t">'+sec.title+'</div>'+
        sec.entries.map(function(e){
          return '<div class="ge"><div class="gterm">'+e.term+'</div>'+
            '<div class="gdef">'+e.def+'</div></div>';
        }).join('')+
      '</div>';
    }).join('');
}
function sh(lbl,sub,gold){
  var c=gold?'#FFD700':'rgba(255,255,255,.3)';
  var bg=gold?'linear-gradient(90deg,rgba(255,215,0,.35),transparent)':'rgba(255,255,255,.07)';
  return '<div class="sh"><span style="color:'+c+'">'+lbl+'</span>'+
    '<div class="ln" style="background:'+bg+'"></div>'+
    (sub?'<span class="sl2" style="color:'+(gold?'rgba(255,215,0,.4)':'rgba(255,255,255,.2)')+'">'+sub+'</span>':'')+
  '</div>';
}
function gfusions(){
  var pool=D.map(function(p,i){return Object.assign({},p,{_i:i});});
  var s=fS+1234;
  function rng(){s=(s^(s<<17))^(s>>13);s^=s<<5;return((s>>>0)/4294967296);}
  pool.sort(function(){return rng()-0.5;});
  pool=pool.slice(0,50);
  var pairs=[];
  for(var i=0;i<25&&i*2+1<pool.length;i++){pairs.push([pool[i*2],pool[i*2+1]]);}
  return pairs;
}
function getMain(g){
  var d=g==='ALL'?D.slice():D.filter(function(p){return p.grade===g;});
  if(cg!=='ALL')d=d.filter(function(p){return gk(p)===cg;});
  return d;
}
function getSsj(){
  var d=D.slice();
  if(cg!=='ALL')d=d.filter(function(p){return gk(p)===cg;});
  return d;
}
function render(){
  var html='';
  var gfel=document.getElementById('gf');
  if(cf==='POWER'){
    gfel.style.display='none'; html=rglos();
  } else if(cf==='FUSIONS'){
    gfel.style.display='none';
    var pairs=gfusions();
    html='<div class="fh">'+
      '<div><div class="ft">FUU… SION… HAA!</div>'+
      '<div class="fs">25 RANDOM PAIRS · TOP 50 SSJ MATCHUPS</div></div>'+
      '<button id="rf" onclick="rF()">🔀 RE-FUSE</button>'+
    '</div>'+pairs.map(function(p,i){return rfusion(p,i);}).join('');
  } else if(cf==='SSJ'){
    gfel.style.display='flex';
    var fd=getSsj().slice(0,50)
      .filter(function(p){return !dO||p.vulnScore>=70;})
      .filter(function(p){return !pO||pl(p.bats,p.throws).a;});
    var dn=dO?'1px solid #FF6B6B':'1px solid rgba(255,80,80,.3)';
    var db=dO?'rgba(255,80,80,.2)':'transparent';
    var dc=dO?'#FF6B6B':'rgba(255,100,80,.65)';
    var pn=pO?'1px solid #FFD700':'1px solid rgba(255,215,0,.25)';
    var pb=pO?'rgba(255,215,0,.15)':'transparent';
    var pc=pO?'#FFD700':'rgba(255,215,0,.5)';
    html='<div id="sf">'+
      '<button class="fp" onclick="tD()" style="border:'+dn+';background:'+db+';color:'+dc+'">⚠ DANGER ONLY</button>'+
      '<button class="fp" onclick="tP()" style="border:'+pn+';background:'+pb+';color:'+pc+'">⚡ PLATOON ADV ONLY</button>'+
      ((dO||pO)?'<span style="font-size:10px;color:rgba(255,255,255,.3);align-self:center">'+fd.length+' results</span>':'')+
    '</div>'+
    (fd.length===0?'<div style="text-align:center;padding:40px;color:rgba(255,255,255,.22);font-size:13px">No matchups match the active filters.</div>':
      fd.map(function(p,i){return rc(p,i+1);}).join(''));
  } else {
    gfel.style.display='flex';
    var d=getMain(cf),top5=getSsj().slice(0,5);
    var feat=d.filter(function(p){return p.zone>=10;});
    var rest=d.filter(function(p){return p.zone<10;});
    if(top5.length){
      var cards=top5.map(function(p,i){
        var pt=pl(p.bats,p.throws),iD=p.vulnScore>=70,hs=p.hitStreak>=4||p.hrStreak>=2||p.hrrStreak>=3;
        return '<div class="o9c o9k-c" style="border:'+(i===0?'1px solid rgba(255,215,0,.55)':'1px solid rgba(255,215,0,.22)')+
          ';background:'+(i===0?'linear-gradient(135deg,rgba(255,215,0,.13),rgba(255,140,0,.06))':'rgba(255,215,0,.05)')+'">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">'+
            '<span style="font-family:Bebas Neue,sans-serif;font-size:18px;color:'+(i===0?'#FFD700':'rgba(255,215,0,.5)')+'">#'+(i+1)+'</span>'+
            '<span style="font-family:Bebas Neue,sans-serif;font-size:14px;color:#FFD700">⚡'+p.zone+'</span>'+
          '</div>'+
          '<div style="font-weight:700;font-size:13px;color:#FFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px">'+p.batter+'</div>'+
          '<div style="font-size:10px;color:rgba(255,215,0,.65);letter-spacing:.1em;margin-bottom:7px">'+p.team+'</div>'+
          '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px">'+
            '<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;background:'+(p.grade==='STRONG'?'rgba(255,215,0,.16)':'rgba(255,255,255,.08)')+';color:'+(p.grade==='STRONG'?'#FFD700':'#999')+'">'+gdsp(p.grade)+'</span>'+
            (iD?'<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;background:rgba(255,80,80,.18);color:#FF6B6B">⚠</span>':'')+

// ── Golden Scroll Grip ──────────────────────────────────────────────
(function(){
  var track=document.getElementById('scroll-track');
  var thumb=document.getElementById('scroll-thumb');
  if(!track||!thumb)return;
  var dragging=false,startY=0,startScroll=0;
  function updateThumb(){
    var docH=document.documentElement.scrollHeight-window.innerHeight;
    var trackH=track.clientHeight-thumb.clientHeight;
    if(docH<=0){track.style.display='none';return;}
    track.style.display='block';
    thumb.style.top=((window.scrollY/docH)*trackH)+'px';
  }
  window.addEventListener('scroll',updateThumb,{passive:true});
  window.addEventListener('resize',updateThumb);
  updateThumb();
  function startDrag(y){dragging=true;startY=y;startScroll=window.scrollY;thumb.classList.add('dragging');}
  function moveDrag(y){
    if(!dragging)return;
    var delta=y-startY,trackH=track.clientHeight-thumb.clientHeight;
    var docH=document.documentElement.scrollHeight-window.innerHeight;
    window.scrollTo(0,Math.max(0,startScroll+(delta/trackH)*docH));
  }
  function endDrag(){dragging=false;thumb.classList.remove('dragging');}
  thumb.addEventListener('touchstart',function(e){startDrag(e.touches[0].clientY);e.preventDefault();},{passive:false});
  document.addEventListener('touchmove',function(e){if(dragging){moveDrag(e.touches[0].clientY);e.preventDefault();}},{passive:false});
  document.addEventListener('touchend',endDrag);
  thumb.addEventListener('mousedown',function(e){startDrag(e.clientY);});
  document.addEventListener('mousemove',function(e){moveDrag(e.clientY);});
  document.addEventListener('mouseup',endDrag);
  // Re-sync thumb after every render call
  var _origRender=window.render;
  if(_origRender)window.render=function(){_origRender();setTimeout(updateThumb,60);};
})();
