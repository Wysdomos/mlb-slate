name: For The Record

on:
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC = 5 AM ET (EDT) — before the morning slate build
  push:
    paths:
      - '**.xlsx'             # any slate workbook upload (handles spaces in the name)
  workflow_dispatch:
    inputs:
      grade_date:
        description: 'Date to grade (M-D, e.g. 6-14); blank = read from the results tab'
        required: false

permissions:
  contents: write

concurrency:
  group: for-the-record
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Grade results and build the record page
        env:
          GRADE_DATE: ${{ github.event.inputs.grade_date }}
          BDL_KEY: ${{ secrets.BDL_KEY }}
        run: |
          python3 grade_results.py
          python3 build_record.py

      # Non-fatal by design: a backfill hiccup must never break the workflow
      # or block record.html from committing. Idempotent per date -- a date
      # already in graded_picks.json is skipped, so re-runs are safe. With no
      # arguments it appends every not-yet-graded committed slate (normally
      # just yesterday's; it also self-heals any date a prior run missed).
      - name: Append graded picks to the backtest store
        continue-on-error: true
        env:
          BDL_KEY: ${{ secrets.BDL_KEY }}
        run: python3 backtest/backfill_grades.py

      - name: Commit record.html + results.json
        env:
          GRADE_DATE: ${{ github.event.inputs.grade_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add record.html results.json backtest/graded_picks.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "For The Record: graded ${GRADE_DATE:-latest slate}"
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch origin ${{ github.ref_name }} || true
            git merge -X ours --no-edit origin/${{ github.ref_name }} || git merge --abort || true
            if git push origin ${{ github.ref_name }}; then pushed=1; echo "pushed on attempt $i"; break; fi
            echo "push rejected, retrying ($i)"; sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "push failed after retries"; exit 1; }

      - name: Telegram alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="🚨 Daily Slate FAILED: ${{ github.workflow }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify Firebase Auto-Healer on Failure
        if: failure()
        run: |
          PAYLOAD=$(printf '{"repository":"%s","run_id":"%s","sha":"%s"}' \
            "${{ github.repository }}" \
            "${{ github.run_id }}" \
            "${{ github.sha }}")
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 \
            -hmac "${{ secrets.WEBHOOK_SECRET }}" | awk '{print $2}')
          curl -s -X POST "${{ secrets.FIREBASE_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            -d "$PAYLOAD"
