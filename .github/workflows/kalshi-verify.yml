name: Kalshi Verify (one-shot)

# TEMPORARY branch-only verification runner for feat/kalshi-pipeline: the
# build sandbox has no route to external-api.kalshi.com, so the real-run
# numbers for K3a commit 4 are measured here. REPORT-ONLY: commits nothing.
# Triggered by pushing K3A_VERIFY to this branch. Removed before finish.

on:
  push:
    branches: [feat/kalshi-pipeline]
    paths: ['K3A_VERIFY']

permissions:
  contents: read

concurrency:
  group: kalshi-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Kalshi markets (commit-1 caps)
        env:
          DATA_FILE: day_data.json
          KALSHI_MARKETS_FILE: kalshi_markets.json
          KALSHI_MAX_MARKET_PAGES: '2'
          KALSHI_MAX_ORDERBOOK_CALLS: '20'
          KALSHI_MIN_REQUEST_GAP: '0.35'
          KALSHI_TIMEOUT: '10'
        run: |
          start=$(date +%s%N)
          python3 fetch_kalshi.py
          end=$(date +%s%N)
          echo "KALSHI_FETCH_MS=$(( (end-start)/1000000 ))"
          python3 - <<'PY'
          import json
          d = json.load(open('kalshi_markets.json'))
          print(f"VERIFY request_count={d.get('request_count')} fetch_ok={d.get('fetch_ok')} markets={len(d.get('markets') or [])}")
          import collections
          states = collections.Counter(str(m.get('tradable_state')) for m in d.get('markets') or [])
          print('VERIFY market states:', dict(states))
          PY

      - name: Build with Kalshi
        env:
          DATA_FILE: day_data.json
          SECTIONS_FILE: built_sections.json
          K_REPORT_FILE: k-report.html
          STREAKS_OUT: streaks_live.json
        run: |
          start=$(date +%s%N)
          python3 build.py
          end=$(date +%s%N)
          echo "BUILD_WITH_KALSHI_MS=$(( (end-start)/1000000 ))"
          python3 - <<'PY'
          import json, collections
          m = json.load(open('kalshi_matches.json'))
          print('VERIFY match counts:', m.get('counts'))
          s = json.load(open('slate_picks.json'))
          picks = s['picks']
          priced = [p for p in picks if p.get('kalshi_price') is not None]
          tickered = [p for p in picks if p.get('kalshi_ticker')]
          print(f"VERIFY picks={len(picks)} with_ticker={len(tickered)} with_live_price={len(priced)}")
          states = collections.Counter(str(p.get('kalshi_state')) for p in tickered)
          print('VERIFY pick kalshi_state:', dict(states))
          bym = collections.defaultdict(lambda: [0, 0])
          for p in picks:
              bym[p['market']][0] += 1
              if p.get('kalshi_ticker'): bym[p['market']][1] += 1
          print('VERIFY per-market ticker coverage:', {k: f"{v[1]}/{v[0]}" for k, v in sorted(bym.items())})
          if tickered:
              t = tickered[0]
              print('VERIFY sample:', json.dumps({k: t.get(k) for k in ('name','market','kalshi_ticker','kalshi_side','kalshi_price','kalshi_state','kalshi_quote_ts','ask_source','fee_band')}))
          PY

      - name: Build without Kalshi (missing-file resilience + timing delta)
        env:
          DATA_FILE: day_data.json
          SECTIONS_FILE: built_sections.json
          K_REPORT_FILE: k-report.html
          STREAKS_OUT: streaks_live.json
        run: |
          rm -f kalshi_markets.json kalshi_matches.json
          start=$(date +%s%N)
          python3 build.py
          end=$(date +%s%N)
          echo "BUILD_WITHOUT_KALSHI_MS=$(( (end-start)/1000000 ))"
          python3 - <<'PY'
          import json
          m = json.load(open('kalshi_matches.json'))
          print(f"VERIFY missing-file path: fetch_ok={m.get('fetch_ok')} error={str(m.get('fetch_error'))[:80]}")
          print("VERIFY build survived kalshi_markets.json deletion")
          PY
